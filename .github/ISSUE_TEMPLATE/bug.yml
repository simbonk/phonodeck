name: Bug
description: Something broke or behaved oddly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
  - type: dropdown
    id: how
    attributes:
      label: How were you playing?
      options:
        - On an invite link
        - With my own Gemini key
        - Offline demo
